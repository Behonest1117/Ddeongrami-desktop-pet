name: Publish Ddeongrami v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release payload
        uses: actions/checkout@v4

      - name: Rebuild and verify installer
        shell: bash
        run: |
          cat .release-payload/Ddeongrami-Setup-v1.0.1.exe.b64.part-* > /tmp/Ddeongrami-Setup-v1.0.1.exe.b64
          base64 --decode /tmp/Ddeongrami-Setup-v1.0.1.exe.b64 > /tmp/Ddeongrami-Setup-v1.0.1.exe
          echo "a3cfd5c4dbd701bce15ffdadd3432588c50830089b65dacb7c945779a4b02381  /tmp/Ddeongrami-Setup-v1.0.1.exe" | sha256sum --check -

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.1 /tmp/Ddeongrami-Setup-v1.0.1.exe --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.0.1 --title "Ddeongrami v1.0.1" --notes-file RELEASE_NOTES_v1.0.1.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.1 /tmp/Ddeongrami-Setup-v1.0.1.exe --title "Ddeongrami v1.0.1" --notes-file RELEASE_NOTES_v1.0.1.md --repo "$GITHUB_REPOSITORY"
          fi
